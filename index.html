<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c8202c">
<title>きんぎょすくい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f0de;--ink:#3a2a20;--pink:#ff4f81}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#e6dcc2;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:"Yusei Magic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#stage{position:absolute;top:0;left:50%;transform:translateX(-50%);overflow:hidden;background:var(--paper)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:absolute;left:1em;right:1em;top:1em;display:flex;gap:.8em;pointer-events:none;color:var(--ink);z-index:2}
.box{position:relative;isolation:isolate;height:5.3em;display:flex;flex-direction:column;align-items:center;justify-content:center;
  --c:#e8822a;--cs:rgba(232,130,42,.35);--w:#ffeeb4}
.box.t{--c:#e8822a;--cs:rgba(232,130,42,.35);--w:#ffeeb4}
.box.m{--c:#e85a8a;--cs:rgba(232,90,138,.3);--w:#ffe6ee}
.box.s{--c:#3a8ad8;--cs:rgba(58,138,216,.3);--w:#e0f3fd}
.box::before,.box::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:1em .7em 1.1em .6em/.7em 1.1em .6em 1em}
.box::before{background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.8),rgba(255,255,255,0) 55%),radial-gradient(circle at 88% 85%,var(--cs),rgba(255,255,255,0) 62%),var(--w);
  border:.24em solid var(--c);box-shadow:inset 0 0 .8em var(--cs),.1em .16em 0 rgba(60,40,20,.14);filter:url(#rough1)}
.box::after{inset:.2em -.14em -.12em .16em;border:.09em solid var(--c);opacity:.5;filter:url(#rough2)}
.box.side{width:7.3em}
.box.mid{flex:1;gap:.7em}
.box small{font-size:1em;color:var(--c);margin-bottom:.1em;text-shadow:.04em .04em 0 rgba(255,255,255,.7)}
.box b{font-size:2.7em;font-weight:400;line-height:1;text-shadow:.04em .05em 0 rgba(60,40,20,.14)}
.box b.low{color:#e23a3a}
.box b.pop{animation:pop .35s}
#lives{display:flex;gap:.3em}
#lives i{display:block;width:1.9em;height:1.9em;transition:all .3s}
#lives i svg{width:100%;height:100%;display:block;overflow:visible}
#lives i.lost{filter:grayscale(1);opacity:.35;transform:scale(.85) rotate(-14deg)}
#hp{width:88%;height:1em;border-radius:1em .5em 1em .6em;background:#fffaf0;border:.17em solid #3b7fc0;overflow:hidden;filter:url(#rough2)}
#hp span{display:block;height:100%;width:100%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 .15em,rgba(255,255,255,0) .15em .4em),linear-gradient(#a9e8fb,#46b8ee)}
#hp.mid span{background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 .15em,rgba(255,255,255,0) .15em .4em),linear-gradient(#ffe99a,#f4c030)}
#hp.low span{background:repeating-linear-gradient(115deg,rgba(255,255,255,.3) 0 .15em,rgba(255,255,255,0) .15em .4em),linear-gradient(#ffb4a4,#ee5444)}

#sound{position:absolute;right:1.2em;bottom:1.6em;width:3em;height:3em;border-radius:50%;border:0;padding:0;z-index:5;
  background:rgba(62,52,52,.85);color:#fff;display:flex;align-items:center;justify-content:center}
#sound svg{width:1.5em;height:1.5em}
#sound .off{display:none}
#sound.muted .on{display:none}
#sound.muted .off{display:block}

#toast{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:3em;color:#fff;z-index:4;pointer-events:none;opacity:0;
  -webkit-text-stroke:.16em #3a1420;paint-order:stroke fill;text-shadow:.06em .08em 0 #3a1420}
#toast.show{animation:toast 1.1s ease-out forwards}

/* screens */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.screen.on{display:flex;animation:fade .25s}
.btn{border:0;background:var(--pink);color:#fff;font:inherit;font-size:1.9em;padding:.4em 1.7em;border-radius:2em;
  box-shadow:0 .14em 0 #c42e5a,0 .3em .5em rgba(0,0,0,.25);cursor:pointer}
.btn.sub{background:#3a8ad8;font-size:1.3em;margin-top:.7em;box-shadow:0 .14em 0 #2a68a8,0 .3em .5em rgba(0,0,0,.25)}
.btn:active{transform:translateY(.1em);box-shadow:0 .04em 0 #c42e5a}
.link{color:#fff;font-size:1.2em;text-decoration:underline;margin-top:1.2em;cursor:pointer;padding:.4em}

#title{background:linear-gradient(rgba(25,70,120,.30),rgba(20,50,95,.55));color:#fff}
.logo{font-size:5.4em;line-height:1.05;margin:0 0 .15em;transform:rotate(-3deg);
  -webkit-text-stroke:.14em #fff8e8;paint-order:stroke fill;text-shadow:.05em .07em 0 rgba(40,60,120,.55)}
.logo span:nth-child(1){color:#ff5a7e}.logo span:nth-child(2){color:#ff9b2f}.logo span:nth-child(3){color:#f2c818}
.logo span:nth-child(4){color:#3cb878}.logo span:nth-child(5){color:#3a9be0}.logo span:nth-child(6){color:#8a63d2}
.logo span:nth-child(7){color:#e8503a}.logo span:nth-child(8){color:#ff5a9a}
.howto{font-size:1.25em;line-height:1.75;margin:.6em 0 1.6em;background:rgba(247,240,222,.18);padding:.7em 1.2em;border-radius:1em;
  text-shadow:0 .08em .2em rgba(0,0,0,.4)}
.best{font-size:1.2em;margin-top:1.1em;color:#ffe27a;text-shadow:0 .08em .2em rgba(0,0,0,.4)}

#catch{background:
  radial-gradient(circle at 50% 27%,rgba(111,200,240,.95) 0,rgba(111,200,240,.75) 22%,rgba(111,200,240,0) 50%),
  radial-gradient(circle at 20% 15%,rgba(255,196,214,.7) 0,rgba(255,196,214,0) 28%),
  radial-gradient(circle at 85% 40%,rgba(255,232,150,.6) 0,rgba(255,232,150,0) 30%),var(--paper);
  color:var(--ink);justify-content:center;cursor:pointer}
#fishView{width:100%;height:auto;aspect-ratio:600/360;margin-top:-6%;animation:fishin .6s cubic-bezier(.2,1.4,.4,1)}
.ctext{display:flex;flex-direction:column;align-items:center;padding:0 1.2em}
.lead{font-size:1.3em;margin-top:.8em}
.fname{font-size:4.8em;line-height:1.15;color:#e23a3a;-webkit-text-stroke:.14em #fff8e8;paint-order:stroke fill;text-shadow:.06em .07em 0 #2a4a8a;animation:pop .5s .1s both}
.fsub{font-size:1.2em;margin-top:.1em}
.fartist{margin-top:.45em;font-size:1.35em;color:#5a4a8a;background:rgba(255,255,255,.6);padding:.1em .9em;border-radius:1em .7em 1em .6em;border:.12em dashed #b49be0}
.fwt{font-size:3.2em;color:#e8820c;line-height:1.2;margin-top:.1em;-webkit-text-stroke:.1em #fff8e8;paint-order:stroke fill}
.fdesc{font-size:1.1em;line-height:1.5;margin-top:.5em;max-width:24em}
.fpts{font-size:2em;margin-top:.5em;color:#d4285a}
.tapnote{position:absolute;left:0;right:0;bottom:2.2em;font-size:1.1em;opacity:.8;animation:blink 1.2s infinite}

#result{background:rgba(14,48,70,.62);color:#fff}
#result h2{font-size:2.6em;font-weight:400;margin:0}
.rbig{font-size:1em;line-height:1.1;margin:.1em 0}
.rbig span{font-size:6.6em;color:#ffd75a;-webkit-text-stroke:.06em rgba(60,30,0,.35);paint-order:stroke fill}
.rbig small{font-size:1.9em;color:#ffd75a}
.rtop{font-size:1.2em;color:#ffe27a;min-height:1.4em}
.rbest{font-size:1em;color:#ffb4c8;margin-top:.2em;min-height:1.2em}
.rlist{width:84%;max-height:11em;overflow-y:auto;margin:.9em 0 1.2em;touch-action:pan-y;font-size:1.1em}
.rrow{display:grid;grid-template-columns:1fr 1.2fr .9fr;text-align:left;padding:.35em .2em;border-bottom:1px solid rgba(255,255,255,.28)}
.rrow span:nth-child(2){text-align:right}.rrow span:nth-child(3){text-align:right}
.rempty{opacity:.85;padding:.8em 0}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fishin{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes toast{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div id="stage">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rough1" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
</defs></svg>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="box side t"><small>のこり</small><b id="time">60</b></div>
    <div class="box mid m"><div id="lives"><i><svg viewBox="0 0 32 34"><circle cx="16" cy="14" r="11" fill="#e4f5fb" stroke="#f26b97" stroke-width="4.2"/><circle cx="16" cy="14" r="13.2" fill="none" stroke="#a04c42" stroke-width="1" opacity=".7"/><path d="M8 6l16 16M24 6L8 22M16 3v22M5 14h22" stroke="#a87060" stroke-width=".9" opacity=".75"/><rect x="13.5" y="26" width="5" height="7" rx="1" fill="#d9a45e" stroke="#8a5230" stroke-width="1.2"/></svg></i><i><svg viewBox="0 0 32 34"><circle cx="16" cy="14" r="11" fill="#e4f5fb" stroke="#f26b97" stroke-width="4.2"/><circle cx="16" cy="14" r="13.2" fill="none" stroke="#a04c42" stroke-width="1" opacity=".7"/><path d="M8 6l16 16M24 6L8 22M16 3v22M5 14h22" stroke="#a87060" stroke-width=".9" opacity=".75"/><rect x="13.5" y="26" width="5" height="7" rx="1" fill="#d9a45e" stroke="#8a5230" stroke-width="1.2"/></svg></i><i><svg viewBox="0 0 32 34"><circle cx="16" cy="14" r="11" fill="#e4f5fb" stroke="#f26b97" stroke-width="4.2"/><circle cx="16" cy="14" r="13.2" fill="none" stroke="#a04c42" stroke-width="1" opacity=".7"/><path d="M8 6l16 16M24 6L8 22M16 3v22M5 14h22" stroke="#a87060" stroke-width=".9" opacity=".75"/><rect x="13.5" y="26" width="5" height="7" rx="1" fill="#d9a45e" stroke="#8a5230" stroke-width="1.2"/></svg></i></div><div id="hp"><span></span></div></div>
    <div class="box side s"><small>とくてん</small><b id="score">0</b></div>
  </div>
  <div id="toast"></div>
  <button id="sound" aria-label="おと">
    <svg class="on" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
  </button>

  <div id="title" class="screen on">
    <div class="logo"><span>き</span><span>ん</span><span>ぎ</span><span>ょ</span><br><span>す</span><span>く</span><span>い</span></div>
    <div class="howto">ドラッグで ポイを うごかそう<br>タップで ポイを みずに いれて<br>もういちど タップで ひきあげるとゲット！<br>みずに いれてる あいだ ポイが いたむよ</div>
    <button class="btn" id="btnStart">はじめる</button>
    <div class="best" id="titleBest"></div>
  </div>

  <div id="catch" class="screen">
    <canvas id="fishView" width="600" height="360"></canvas>
    <div class="ctext">
      <div class="lead">すくい上げたのは…</div>
      <div class="fname" id="cName"></div>
      <div class="fsub" id="cSub"></div>
      <div class="fartist" id="cArtist"></div>
      <div class="fwt" id="cWt"></div>
      <div class="fdesc" id="cDesc"></div>
      <div class="fpts" id="cPts"></div>
    </div>
    <div class="tapnote">タップでつづける</div>
  </div>

  <div id="result" class="screen">
    <h2>けっか</h2>
    <div class="rbig"><span id="rScore">0</span><small>点</small></div>
    <div class="rtop" id="rTop"></div>
    <div class="rbest" id="rBest"></div>
    <div class="rlist" id="rList"></div>
    <button class="btn" id="btnRetry">もう一度</button>
    <button class="btn sub" id="btnSend">スコアをおくる</button>
    <a class="link" id="btnTitle">タイトルへ</a>
  </div>
</div>

<script src="score.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- さかな設定 ---------- */
const GAME_TIME=60, POI_LIVES=3;
const KINDS={
  small:{name:'フナ',sub:'ギンブナ',L:62,hw:.13,speed:72,turn:2.6,pts:20,dmg:6,gMin:90,gMax:420,count:8,catchR:1,
    desc:'川や池にすむ、やさしいおさかな。金魚のご先祖さま。',sil:'#101c27',silLine:'#0a131b',
    silRays:'rgba(150,185,205,.5)',silHatch:['rgba(150,185,205,.22)','rgba(0,0,0,.4)'],
    color:{top:'#8f9560',bot:'#e9e4c6',fin:'#b3a96a',line:'#4a4a2c',rays:'#7a7040'},viewL:360},
  medium:{name:'ブリ',sub:'ぶり',L:110,hw:.12,speed:56,turn:1.7,pts:120,dmg:16,gMin:4000,gMax:14000,count:4,catchR:1,
    desc:'大きくなるほど名前がかわる、出世魚。',sil:'#13222f',silLine:'#0a131b',
    silRays:'rgba(150,185,205,.45)',silHatch:['rgba(150,185,205,.22)','rgba(0,0,0,.4)'],
    color:{top:'#4d7499',bot:'#eaf0f3',fin:'#d8b83e',line:'#1f3b57',stripe:'#f2cf4a',rays:'#a8871c'},viewL:420},
  large:{name:'マグロ',sub:'クロマグロ',L:190,hw:.12,speed:38,turn:1,pts:300,dmg:30,gMin:60000,gMax:250000,count:2,catchR:1.3,
    desc:'海のスピードスター。300kgを超えるものもいる。',sil:'#59626b',silLine:'#14181d',
    silRays:'#1b2127',silHatch:['rgba(10,14,18,.5)','rgba(210,214,218,.28)'],
    color:{top:'#1f3a58',bot:'#c9d3dd',fin:'#27466b',line:'#0f2238',finlets:'#e0d36a',rays:'#12263d'},viewL:470}
};
const KEYS=Object.keys(KINDS);

/* ---------- こどもの絵(さかなの種類) ----------
   src: assets/ の画像(右むき・背景透過)  artist: 絵をかいた子の名前(つりあげ画面に表示)
   anim:'pulse' はタコのように ふわふわ動く絵 */
const VARIANTS={
  small:[
    {id:'kingyo',name:'キンギョ',sub:'金魚',desc:'ひらひらの おびれが じまんの、おまつりの にんきもの。',pts:20,gMin:15,gMax:120,src:'assets/kingyo.png',artist:'みきちゃん（５歳）'},
    {id:'demekin',name:'デメキン',sub:'出目金',desc:'目が ぷっくり とびだした、くろい きんぎょ。',pts:30,gMin:30,gMax:150,src:'assets/demekin.png',artist:'けんとくん（６歳）',w:.7}
  ],
  medium:[
    {id:'koi',name:'コイ',sub:'ニシキゴイ',desc:'池を ゆうゆう およぐ、にしきの おさかな。',pts:120,gMin:2000,gMax:12000,src:'assets/koi.png',artist:'ゆいちゃん（４歳）'},
    {id:'jinmen',name:'人面魚',sub:'ジンメンギョ',desc:'ふしぎな かおの おさかな。ほんとうに いるのかな？',pts:200,gMin:3000,gMax:9000,src:'assets/jinmengyo.png',artist:'そうたくん（７歳）',w:.6}
  ],
  large:[
    {id:'tako',name:'タコ',sub:'ミズダコ',desc:'うでが 8ぽん。ぐにゃぐにゃ やわらかい、ひとなつっこい いきもの。',pts:250,gMin:15000,gMax:60000,src:'assets/tako.png',artist:'はるとくん（６歳）',anim:'pulse'},
    {id:'iruka',name:'イルカ',sub:'バンドウイルカ',desc:'とっても あたまが いい、うみの にんきもの。ジャンプが とくい。',pts:300,gMin:100000,gMax:300000,src:'assets/iruka.png',artist:'さくらちゃん（５歳）'}
  ]
};
const info=(kind,v)=>v?{...KINDS[kind],...v}:KINDS[kind];
function pickVariant(kind){
  const list=KINDS[kind].variants;let t=0;list.forEach(v=>t+=v.w||1);
  let r=Math.random()*t;for(const v of list){r-=v.w||1;if(r<=0)return v}
  return list[0];
}
function mip(img,tw){
  let w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');
  c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0);
  while(w/2>=tw){
    const n=document.createElement('canvas');w=Math.round(w/2);h=Math.round(h/2);n.width=w;n.height=h;
    const x=n.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c,0,0,w,h);c=n;
  }
  return c;
}
KEYS.forEach(k=>{
  const K=KINDS[k];
  K.variants=VARIANTS[k].map(v=>({...v,kind:k}));
  K.variants.forEach(v=>{
    v.img=new Image();
    v.img.onload=()=>{
      const m=mip(v.img,K.L*3.4),g=m.getContext('2d');
      g.globalCompositeOperation='source-atop';g.fillStyle='rgba(14,27,39,.84)';g.fillRect(0,0,m.width,m.height);
      v.shadow=m;v.ready=true;
    };
    v.img.src=v.src;
  });
});
// 絵を左右にしならせて泳がせる(sh=true: 水中の魚影)
function drawImgFish(g,v,L,phase,sh,amp=.06){
  const im=sh?v.shadow:v.img,iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
  const Wd=L*1.12,Hd=Wd*ih/iw;
  g.save();
  if(v.anim==='pulse'){
    const k=1+.05*Math.sin(phase*.9);
    if(sh)g.rotate(Math.PI/2);
    g.rotate(.07*Math.sin(phase*.6));g.scale(k,2-k);
    g.drawImage(im,-Wd/2,-Hd/2,Wd,Hd);
  }else{
    g.translate(-L*.06,0);
    const N=16;
    for(let i=0;i<N;i++){
      const sx0=iw*(1-(i+1)/N),sx1=iw*(1-i/N),tt=(i+.5)/N;
      const dy=amp*Wd*Math.sin(phase-tt*3.2)*Math.pow(tt,1.2);
      const sw=Math.min(iw-sx0,sx1-sx0+1);
      g.drawImage(im,sx0,0,sw,ih,-Wd/2+sx0/iw*Wd,-Hd/2+dy,sw/iw*Wd+.5,Hd);
    }
  }
  g.restore();
}

/* ---------- レイアウト ---------- */
const stage=$('#stage'),cv=$('#game'),ctx=cv.getContext('2d');
let W=0,H=0,U=1,DPR=1,bg=null;
const pool={l:0,t:0,r:0,b:0,w:0,h:0,stripH:0};
const PR=64, RW=10, PS=PR/94; // ポイの半径(輪の中心線)と輪の太さ

function resize(){
  const old={...pool};
  const iw=innerWidth,ih=innerHeight;
  if(iw<50||ih<50)return;
  W=Math.round(Math.min(iw,ih/1.75));H=ih;
  stage.style.width=W+'px';stage.style.height=H+'px';
  U=W/568;stage.style.fontSize=(16*U)+'px';
  DPR=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const extra=Math.max(0,H-1.8*W);
  pool.l=0;pool.r=W;pool.t=W*.315+extra*.12;pool.b=pool.t+W*1.056+extra*.5;
  pool.w=pool.r-pool.l;pool.h=pool.b-pool.t;pool.stripH=W*.18;
  if(!old.w){
    poi.x=poi.tx=(pool.l+pool.r)/2;poi.y=poi.ty=pool.t+pool.h*.72;
    if(state==='title')populate();
  }else{
    const mx=x=>pool.l+(x-old.l)/old.w*pool.w, my=y=>pool.t+(y-old.t)/old.h*pool.h;
    fishes.forEach(f=>{f.x=mx(f.x);f.y=my(f.y)});
    poi.x=mx(poi.x);poi.y=my(poi.y);poi.tx=mx(poi.tx);poi.ty=my(poi.ty);
  }
  bg=renderBg();
}

/* ---------- 背景(水彩+クレヨン風) ---------- */
function smooth(g,p){
  g.moveTo((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);
  for(let i=1;i<=p.length;i++){const a=p[i%p.length],b=p[(i+1)%p.length];g.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2)}
  g.closePath();
}
function wob(g,cx,cy,r,seed,amt,n=30){
  const R=rng(seed),p=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(1+(R()-.5)*amt);p.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr})}
  smooth(g,p);
}
function rectPts(l,t,w,h,step,j,R){
  const p=[],jit=()=>(R()-.5)*2*j;
  const nx=Math.max(2,Math.round(w/step)),ny=Math.max(2,Math.round(h/step));
  for(let i=0;i<nx;i++)p.push({x:l+w*i/nx+jit(),y:t+jit()});
  for(let i=0;i<ny;i++)p.push({x:l+w+jit(),y:t+h*i/ny+jit()});
  for(let i=0;i<nx;i++)p.push({x:l+w-w*i/nx+jit(),y:t+h+jit()});
  for(let i=0;i<ny;i++)p.push({x:l+jit(),y:t+h-h*i/ny+jit()});
  return p;
}
function blotch(g,cx,cy,r,seed){
  const R=rng(seed),n=16,p=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(.6+R()*.8);p.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr*.85})}
  smooth(g,p);
}
function roughLine(g,x1,x2,y,R,j,step){
  g.moveTo(x1,y+(R()-.5)*j);
  for(let x=x1+step;x<x2;x+=step)g.lineTo(x,y+(R()-.5)*j);
  g.lineTo(x2,y+(R()-.5)*j);
}
function paintBand(g,x,y,w,h,base,cols,hi,R,strokes,wb){
  const mg=wb?20*U:0,top=[];
  for(let px=x-mg;px<=x+w+mg;px+=22*U)top.push([px,y+(wb?(R()-.5)*wb:0)]);
  g.save();g.beginPath();g.moveTo(x-mg,y+h);top.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(x+w+mg,y+h);g.closePath();g.clip();
  g.fillStyle=base;g.fillRect(x-mg,y-(wb||0),w+mg*2,h+(wb||0)+4);
  g.lineCap='round';
  for(let i=0;i<strokes;i++){
    const sx=x+R()*w-40*U,sy=y+R()*h,len=(60+R()*240)*U;
    g.strokeStyle=rgba(hex(cols[(R()*cols.length)|0]),.14+R()*.22);g.lineWidth=(6+R()*20)*U;
    g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+len,sy+(R()-.5)*12*U);g.stroke();
  }
  for(let i=0;i<strokes*.5;i++){
    const sx=x+R()*w-40*U,sy=y+R()*h,len=(40+R()*200)*U;
    g.strokeStyle=rgba(hex(hi),.10+R()*.2);g.lineWidth=(1.5+R()*3)*U;
    g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+len,sy+(R()-.5)*6*U);g.stroke();
  }
  if(wb){g.strokeStyle='rgba(90,0,15,.28)';g.lineWidth=4*U;g.beginPath();top.forEach((p,i)=>i?g.lineTo(p[0],p[1]+2*U):g.moveTo(p[0],p[1]+2*U));g.stroke()}
  g.restore();
}
function crackLayer(w,h){
  const sc=.75,vw=Math.ceil(w*sc),vh=Math.ceil(h*sc),R=rng(21);
  const gx=4,gy=Math.max(4,Math.round(4.4*h/w)),pts=[];
  for(let j=-1;j<=gy;j++)for(let i=-1;i<=gx;i++)pts.push([(i+.05+R()*.9)*vw/gx,(j+.05+R()*.9)*vh/gy]);
  const im=new ImageData(vw,vh),d=im.data,th=Math.max(1.8,4.2*U);
  for(let y=0;y<vh;y++)for(let x=0;x<vw;x++){
    const wx=x+2.4*Math.sin(y*.13+1.3)+1.4*Math.sin(y*.37),wy=y+2.4*Math.sin(x*.12)+1.4*Math.sin(x*.33+2);
    let d1=1e9,d2=1e9;
    for(let k=0;k<pts.length;k++){const dx=pts[k][0]-wx,dy=pts[k][1]-wy,dd=dx*dx+dy*dy;if(dd<d1){d2=d1;d1=dd}else if(dd<d2)d2=dd}
    const e=Math.sqrt(d2)-Math.sqrt(d1);
    const k=.55+.9*(.5+.5*Math.sin(x*.09+y*.05)*Math.cos(y*.08-x*.03));
    let a=1-e/(th*k);
    if(a<=0)continue;
    a=Math.pow(a,.6);
    if(Math.sin(x*.06+y*.09)+Math.sin(x*.11-y*.07)>1.45)a*=.25;
    const hh=(((x*73856093)^(y*19349663))>>>0)%1000/1000;
    if(hh<.25)a*=.3;
    const i=(y*vw+x)*4;d[i]=238;d[i+1]=250;d[i+2]=255;d[i+3]=Math.min(255,a*245);
  }
  const c=document.createElement('canvas');c.width=vw;c.height=vh;c.getContext('2d').putImageData(im,0,0);
  return c;
}
function renderBg(){
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
  const g=c.getContext('2d');g.scale(DPR,DPR);
  const R=rng(7);
  // 紙
  g.fillStyle='#f7f0de';g.fillRect(0,0,W,H);
  for(let i=0;i<W*H/35;i++){g.fillStyle=R()<.5?'rgba(120,90,50,.05)':'rgba(255,255,255,.35)';g.fillRect(R()*W,R()*H,1+R()*1.5,1+R()*1.5)}
  for(let i=0;i<W*H/9000;i++){
    const x=R()*W,y=R()*H,a=R()*TAU,l=(4+R()*10)*U;
    g.strokeStyle=R()<.5?'rgba(140,110,70,.07)':'rgba(255,255,255,.4)';g.lineWidth=1;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  // 水(水彩)
  const wp=rectPts(pool.l-12*U,pool.t,pool.w+24*U,pool.h,28*U,4*U,rng(3));
  g.save();g.beginPath();smooth(g,wp);g.clip();
  const bgG=g.createLinearGradient(pool.l,pool.t,pool.l+pool.w*.7,pool.b);
  bgG.addColorStop(0,'#9be0f5');bgG.addColorStop(.35,'#62bdee');bgG.addColorStop(.7,'#4aa2e4');bgG.addColorStop(1,'#3a86d8');
  g.fillStyle=bgG;g.fillRect(pool.l,pool.t,pool.w,pool.h);
  const wc=['#2a86d8','#2a86d8','#4fc1ee','#7fdcf4','#34b2cf','#5ad0d8','#e8f8ff','#bfeaf8','#2f6fc8'].map(hex);
  for(let i=0;i<48;i++){
    const x=pool.l+R()*pool.w,y=pool.t+R()*pool.h,r=(50+R()*150)*U,col=wc[(R()*wc.length)|0];
    g.beginPath();blotch(g,x,y,r,i+40);
    g.fillStyle=rgba(col,.14+R()*.2);g.fill();
    g.strokeStyle=rgba(col,.22);g.lineWidth=1.6*U;g.stroke();
  }
  [[.18,.1,.55,'255,255,255',.4],[.7,.5,.5,'60,192,200',.28],[.25,.85,.5,'20,90,190',.25]].forEach(([fx,fy,fr,col,a])=>{
    const x=pool.l+pool.w*fx,y=pool.t+pool.h*fy,r=pool.w*fr,gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(pool.l,pool.t,pool.w,pool.h);
  });
  for(let i=0;i<pool.w*pool.h/16;i++){g.fillStyle=R()<.5?'rgba(255,255,255,.09)':'rgba(10,50,130,.07)';g.fillRect(pool.l+R()*pool.w,pool.t+R()*pool.h,1+R()*1.6,1+R()*1.6)}
  // ひび(白いクレヨン)
  const cl=crackLayer(pool.w,pool.h);
  g.imageSmoothingEnabled=true;
  g.globalAlpha=.28;g.drawImage(cl,pool.l+3*U,pool.t+2*U,pool.w,pool.h);
  g.globalAlpha=.92;g.drawImage(cl,pool.l,pool.t,pool.w,pool.h);
  g.globalAlpha=1;
  // あわ・きらめき
  g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<7;i++){
    const x=pool.l+(.12+R()*.76)*pool.w,y=pool.t+(.1+R()*.8)*pool.h,r=(14+R()*30)*U;
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=(2.5+R()*2)*U;
    g.beginPath();wob(g,x,y,r,i*13+1,.25,14);g.stroke();
    g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=1.8*U;
    g.beginPath();wob(g,x+2*U,y-1*U,r*.9,i*13+2,.25,14);g.stroke();
    g.beginPath();wob(g,x-1*U,y+2*U,r*1.05,i*13+3,.3,14);g.stroke();
  }
  for(let i=0;i<5;i++){
    const x=pool.l+R()*pool.w*.7,y=pool.t+R()*pool.h*.5;
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=(3+R()*3)*U;
    g.beginPath();g.moveTo(x,y);
    for(let k=1;k<5;k++)g.lineTo(x+k*14*U+(R()-.5)*6*U,y+(k%2?-5:5)*U+(R()-.5)*6*U);
    g.stroke();
  }
  // ふちに絵の具がたまる
  g.strokeStyle='rgba(20,80,170,.22)';g.lineWidth=18*U;g.beginPath();smooth(g,wp);g.stroke();
  g.restore();
  // ふち(クレヨン)
  g.lineJoin='round';
  [['#2f66b8',3.4,0,0,1],['rgba(70,130,210,.6)',2,1.5,1,2]].forEach(([col,lw,ox,oy,s])=>{
    g.strokeStyle=col;g.lineWidth=lw*U;g.beginPath();
    smooth(g,rectPts(pool.l-12*U+ox*U,pool.t+oy*U,pool.w+24*U,pool.h,26*U,2.5*U,rng(30+s)));g.stroke();
  });
  // 手前の壁
  const sy=pool.b,sh=pool.stripH,sx1=pool.l-4*U,sx2=pool.r+4*U;
  paintBand(g,sx1,sy,sx2-sx1,sh,'#4aa59a',['#2a8a8a','#58b894','#78c8a0','#2a7aa8','#9ad8b8','#3a9a6a'],'#d8f4e8',R,90,0);
  g.fillStyle='rgba(190,240,232,.8)';g.fillRect(sx1,sy,sx2-sx1,sh*.14);
  g.strokeStyle='#1f6f7c';g.lineWidth=3*U;g.beginPath();roughLine(g,sx1,sx2,sy+sh,R,2.5*U,20*U);g.stroke();
  g.strokeStyle='rgba(47,102,184,.75)';g.beginPath();roughLine(g,sx1,sx2,sy,R,2*U,20*U);g.stroke();
  g.strokeStyle='rgba(30,100,110,.5)';g.lineWidth=2*U;g.beginPath();roughLine(g,sx1,sx2,sy+sh*.2,R,2*U,24*U);g.stroke();
  // 赤い絵の具
  const rb=sy+sh;
  paintBand(g,0,rb,W,H-rb,'#d4222c',['#a8121f','#e8454a','#ff6a5a','#8f0f1c','#d83a3a'],'#ffb8a0',R,220,10*U);
  paintBand(g,0,0,W,W*.032,'#d4222c',['#a8121f','#e8454a','#ff6a5a'],'#ffb8a0',R,40,0);
  return c;
}

function makePat(base,seed){
  const c=document.createElement('canvas');c.width=c.height=48;
  const g=c.getContext('2d'),R=rng(seed);
  g.fillStyle=base;g.fillRect(0,0,48,48);
  for(let i=0;i<150;i++){g.fillStyle=R()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.18)';g.fillRect(R()*48,R()*48,1+R()*1.6,1+R()*1.6)}
  return ctx.createPattern(c,'repeat');
}
const silStyle={};
function silFor(k){
  if(!silStyle[k]){const K=KINDS[k];silStyle[k]={hw:K.hw,flat:makePat(K.sil,KEYS.indexOf(k)+11),line:K.silLine,rays:K.silRays,hatch:K.silHatch,amp:.05}}
  return silStyle[k];
}
function drawFish(g,L,phase,st,seed){
  const hw=L*st.hw,n=16,amp=st.amp,sp=[];
  for(let i=0;i<=n;i++){
    const t=i/n,x=L*(.5-.78*t),y=amp*L*Math.sin(phase-t*3.2)*Math.pow(t,1.2);
    let w;
    if(t<.35){const q=(.35-t)/.35;w=Math.sqrt(Math.max(0,1-q*q))}else{const u=(t-.35)/.65;w=.1+.9*Math.pow(1-u,.85)}
    sp.push({x,y,w:w*hw});
  }
  const lw=Math.max(1.5,L*.012);
  const body=()=>{
    const p=[];
    for(let i=0;i<=n;i++)p.push({x:sp[i].x,y:sp[i].y-sp[i].w});
    for(let i=n-1;i>0;i--)p.push({x:sp[i].x,y:sp[i].y+sp[i].w});
    smooth(g,p);
  };
  const line=()=>{
    g.lineJoin='round';g.lineWidth=lw;g.strokeStyle=st.line;g.stroke();
    g.save();g.translate(lw*.5,-lw*.4);g.globalAlpha*=.5;g.lineWidth=lw*.7;g.stroke();g.restore();
  };
  let fillB=st.flat,fillF=st.flat;
  if(!st.flat){
    const gr=g.createLinearGradient(0,-hw,0,hw);
    gr.addColorStop(0,st.top);gr.addColorStop(.48,st.top);gr.addColorStop(.74,st.bot);gr.addColorStop(1,st.bot);
    fillB=gr;fillF=st.fin;
  }
  // 尾びれ
  const E=sp[n],P=sp[n-1],al=Math.atan2(E.y-P.y,E.x-P.x),wag=amp*6*Math.sin(phase-4.2);
  const tl=L*.34,tw=L*.29;
  const tailPath=()=>{g.beginPath();g.moveTo(0,-E.w);g.quadraticCurveTo(tl*.45,-tw*.85,tl,-tw);g.quadraticCurveTo(tl*.68,-tw*.2,tl*.8,0);g.quadraticCurveTo(tl*.68,tw*.2,tl,tw);g.quadraticCurveTo(tl*.45,tw*.85,0,E.w);g.closePath()};
  g.save();g.translate(E.x,E.y);g.rotate(al+wag);
  tailPath();g.fillStyle=fillF;g.fill();
  if(st.rays){
    g.strokeStyle=st.rays;g.lineWidth=Math.max(1,L*.009);g.lineCap='round';
    for(let k=-4;k<=4;k++){g.beginPath();g.moveTo(tl*.06,k*E.w*.22);g.quadraticCurveTo(tl*.5,k*tw/5.2,tl*(.95-Math.abs(k)*.02),k*tw/4.2);g.stroke()}
  }
  tailPath();line();g.restore();
  // せびれ
  const A=sp[4],B=sp[9],Pk=sp[7],fh=L*(st.flat?.13:.15);
  g.beginPath();g.moveTo(A.x,A.y-A.w+1);g.quadraticCurveTo(A.x-L*.02,A.y-A.w-fh*.9,Pk.x-L*.01,Pk.y-Pk.w-fh);
  g.quadraticCurveTo(B.x+L*.02,B.y-B.w-fh*.25,B.x,B.y-B.w+1);g.closePath();
  g.fillStyle=fillF;g.fill();line();
  // むなびれ
  const C=sp[4],D=sp[6],T=sp[8];
  g.beginPath();g.moveTo(C.x,C.y+C.w*.7);g.quadraticCurveTo(sp[5].x,T.y+T.w+L*.1,T.x,T.y+T.w+L*.1);g.lineTo(D.x,D.y+D.w*.75);g.closePath();
  g.fillStyle=fillF;g.fill();line();
  // からだ
  g.beginPath();body();g.fillStyle=fillB;g.fill();
  {
    g.save();g.beginPath();body();g.clip();
    if(st.stripe){
      g.strokeStyle=st.stripe;g.lineWidth=L*.035;g.lineCap='round';g.beginPath();
      sp.forEach((s,i)=>{const x=s.x,y=s.y+s.w*.12;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
    }
    const hc=st.hatch||['rgba(0,0,20,.12)','rgba(255,255,255,.2)'];
    const R=rng(seed||5),cnt=Math.min(80,Math.round(L/(st.flat?3.2:1.8)));g.lineCap='round';
    for(let i=0;i<cnt;i++){
      const x=(R()-.7)*L*.8+L*.25,y=(R()-.5)*hw*2.4;
      g.strokeStyle=hc[i%2];g.lineWidth=L*.011;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+L*.07,y-L*.03);g.stroke();
    }
    if(!st.flat){g.fillStyle='rgba(255,255,255,.26)';g.beginPath();g.ellipse(L*.08,-hw*.5,L*.28,hw*.22,-.05,0,TAU);g.fill()}
    g.restore();
  }
  g.beginPath();body();line();
  // 小びれ・め
  if(st.finlets){
    g.fillStyle=st.finlets;
    for(let i=0;i<6;i++){
      const a=sp[10+i],b=sp[11+i];if(!b)break;
      [-1,1].forEach(s=>{
        g.beginPath();g.moveTo(a.x,a.y+s*a.w);g.lineTo(a.x-L*.012,a.y+s*(a.w+L*.04));g.lineTo(b.x,b.y+s*b.w);g.closePath();g.fill();
        g.strokeStyle=st.line;g.lineWidth=lw*.6;g.stroke();
      });
    }
  }
  if(!st.flat){
    const e=sp[2];
    g.fillStyle='#fff';g.beginPath();g.arc(e.x,e.y-e.w*.2,L*.03,0,TAU);g.fill();
    g.strokeStyle=st.line;g.lineWidth=lw*.7;g.stroke();
    g.fillStyle='#10151c';g.beginPath();g.arc(e.x+L*.005,e.y-e.w*.2,L*.018,0,TAU);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(e.x+L*.002,e.y-e.w*.2-L*.007,L*.006,0,TAU);g.fill();
  }
}

let AC=null,muted=store.get('kingyo_mute','0')==='1';
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,delay=0,slide=0){
  const a=audio();if(!a||muted)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,f0,f1){
  const a=audio();if(!a||muted)return;const t=a.currentTime,len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);
  const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(a.destination);s.start(t);
}
const sfx={
  tap(){tone(520,.08,'square',.05)},
  dip(){noise(.32,.3,700,1800)},
  catch(big){[660,880,1320].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.09));if(big)[1760,2093].forEach((f,i)=>tone(f,.3,'triangle',.14,.3+i*.1))},
  brk(){tone(340,.55,'sawtooth',.1,0,-260);noise(.4,.25,2400,300)},
  lift(){noise(.22,.22,1600,500)},
  end(){[784,659,523].forEach((f,i)=>tone(f,.3,'triangle',.16,i*.16))}
};
function applyMute(){$('#sound').classList.toggle('muted',muted)}
$('#sound').addEventListener('click',()=>{muted=!muted;store.set('kingyo_mute',muted?'1':'0');applyMute();if(!muted){audio();sfx.tap()}});
applyMute();

/* ---------- さかな ---------- */
function spawnFish(kind,fade){
  const K=KINDS[kind],f={kind,v:pickVariant(kind),fy:1,L:K.L*rand(.9,1.1),sp:K.speed*rand(.85,1.15),th:rand(0,TAU),tt:0,tcd:rand(.5,3),phase:rand(0,TAU),flee:0,a:fade?0:1};
  let tries=0;
  do{f.x=rand(pool.l+f.L*U*.5,pool.r-f.L*U*.5);f.y=rand(pool.t+f.L*U*.5,pool.b-f.L*U*.5)}
  while(state!=='title'&&Math.hypot(f.x-poi.x,f.y-poi.y)<160*U&&tries++<30);
  f.tt=f.th;return f;
}
function populate(){fishes=[];respawn=[];KEYS.forEach(k=>{for(let i=0;i<KINDS[k].count;i++)fishes.push(spawnFish(k,false))})}
function updateFish(dt){
  const cx=(pool.l+pool.r)/2,cy=(pool.t+pool.b)/2;
  for(const f of fishes){
    const K=KINDS[f.kind],Lp=f.L*U;
    f.a=Math.min(1,f.a+dt*1.2);
    f.fy+=((f.v&&f.v.anim==='pulse'?1:(Math.cos(f.th)<0?-1:1))-f.fy)*(1-Math.exp(-8*dt));
    f.tcd-=dt;if(f.tcd<=0){f.tt=f.th+rand(-1.3,1.3);f.tcd=rand(1,3.2)}
    const m=Lp*.6+8*U;
    if(f.x<pool.l+m||f.x>pool.r-m||f.y<pool.t+m||f.y>pool.b-m)f.tt=Math.atan2(cy-f.y,cx-f.x)+rand(-.35,.35);
    const d=angDiff(f.tt,f.th),tr=K.turn*(f.flee>0?2:1)*dt;f.th+=clamp(d,-tr,tr);
    let sp=f.sp*U*(.75+.25*Math.sin(f.phase*.5));
    if(f.flee>0){f.flee-=dt;sp*=2.6}
    f.x=clamp(f.x+Math.cos(f.th)*sp*dt,pool.l+Lp*.25,pool.r-Lp*.25);
    f.y=clamp(f.y+Math.sin(f.th)*sp*dt,pool.t+Lp*.25,pool.b-Lp*.25);
    f.phase+=dt*(3.5+sp/U/14);
  }
  for(let i=respawn.length-1;i>=0;i--){respawn[i].t-=dt;if(respawn[i].t<=0){fishes.push(spawnFish(respawn[i].kind,true));respawn.splice(i,1)}}
}

/* ---------- ポイ ---------- */
function drawPoi(g,o){
  const R=PR*U,rw=RW*U,u=U*PS,lift=clamp((o.s-.9)/.16,0,1);
  g.save();g.globalAlpha=o.alpha;
  const so=(3+9*lift)*U,sx=o.x+so,sy=o.y+so*1.2,sg=g.createRadialGradient(sx,sy,R*.8,sx,sy,R*1.12);
  sg.addColorStop(0,`rgba(10,50,90,${.08+.08*lift})`);sg.addColorStop(1,'rgba(10,50,90,0)');
  g.fillStyle=sg;g.beginPath();g.arc(sx,sy,R*1.12,0,TAU);g.fill();
  g.translate(o.x,o.y);g.rotate(o.rot);g.scale(o.s,o.s);
  g.lineJoin='round';g.lineCap='round';
  // え
  g.fillStyle='#f26b97';g.fillRect(-5*u,R-3*u,10*u,30*u);
  g.strokeStyle='#a04c42';g.lineWidth=2*u;g.strokeRect(-5*u,R-3*u,10*u,30*u);
  g.fillStyle='#d9a45e';g.fillRect(-12*u,R+24*u,24*u,66*u);
  g.fillStyle='#ecc58a';g.fillRect(-12*u,R+24*u,24*u,11*u);
  g.fillStyle='rgba(120,80,30,.22)';g.fillRect(2*u,R+35*u,10*u,55*u);
  g.strokeStyle='#8a5230';g.lineWidth=2.2*u;g.strokeRect(-12*u,R+24*u,24*u,66*u);
  // あみ
  const mr=R-rw*.45;
  g.beginPath();wob(g,0,0,mr,5,.03);
  g.fillStyle=o.water?'rgba(70,165,230,.42)':'rgba(215,240,250,.5)';g.fill();
  g.save();g.clip();
  g.strokeStyle=o.water?'rgba(40,100,160,.5)':'rgba(150,100,85,.65)';g.lineWidth=1.3*U;
  g.beginPath();
  for(let k=-10;k<=10;k++){const c=k*12*U;g.moveTo(c-R,-R);g.lineTo(c+R,R);g.moveTo(c+R,-R);g.lineTo(c-R,R)}
  g.stroke();
  const nc=Math.min(cracks.length,Math.floor((1-o.hp)*7.5)+(o.hp<=0?7:0));
  g.strokeStyle='rgba(70,35,50,.8)';g.lineWidth=2*U;
  for(let i=0;i<nc;i++){g.beginPath();cracks[i].forEach((p,k)=>k?g.lineTo(p[0]*R,p[1]*R):g.moveTo(p[0]*R,p[1]*R));g.stroke()}
  g.restore();
  // わっか
  g.beginPath();wob(g,0,0,R,5,.03);g.strokeStyle='#f26b97';g.lineWidth=rw;g.stroke();
  g.beginPath();g.arc(0,0,R-rw*.12,Math.PI*1.05,Math.PI*1.62);g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=rw*.25;g.stroke();
  g.strokeStyle='#a04c42';g.lineWidth=2*U;
  g.beginPath();wob(g,0,0,R+rw/2,8,.03);g.stroke();
  g.globalAlpha=o.alpha*.7;g.lineWidth=1.8*U;g.beginPath();wob(g,0,0,R-rw/2,9,.03);g.stroke();
  g.globalAlpha=o.alpha*.4;g.beginPath();wob(g,1.2*U,-1*U,R+rw*.55,10,.04);g.stroke();
  g.globalAlpha=o.alpha;
  if(o.hold){g.save();g.rotate(o.hold.th);const hv=o.hold.v;if(hv&&hv.ready)drawImgFish(g,hv,o.hold.L*U,clock*12,true);else drawFish(g,o.hold.L*U,clock*12,silFor(o.hold.kind),3);g.restore()}
  g.restore();
}

/* ---------- ゲーム進行 ---------- */
const el={time:$('#time'),score:$('#score'),hp:$('#hp'),hpbar:$('#hp span'),lives:[...document.querySelectorAll('#lives i')]};
function hud(){
  const t=Math.max(0,Math.ceil(time));
  if(el.time.textContent!=t){el.time.textContent=t}
  el.time.classList.toggle('low',t<=10&&state!=='title');
  if(el.score.textContent!=score){el.score.textContent=score;el.score.classList.remove('pop');void el.score.offsetWidth;el.score.classList.add('pop')}
  el.hpbar.style.width=Math.max(0,hpShown*100)+'%';
  el.hp.className=hpShown>.5?'':hpShown>.25?'mid':'low';
  el.lives.forEach((e,i)=>e.classList.toggle('lost',i>=lives));
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
function show(id){['title','catch','result'].forEach(s=>$('#'+s).classList.toggle('on',s===id))}

function startGame(){
  audio();sfx.tap();
  time=GAME_TIME;score=0;lives=POI_LIVES;hp=1;hpShown=1;caught=[];ripples=[];
  poi.x=poi.tx=(pool.l+pool.r)/2;poi.y=poi.ty=pool.t+pool.h*.72;poi.down=false;poi.busy=0;poi.s=1.06;poi.hold=null;
  state='play';populate();show(null);hud();
}
function damage(n){hp-=n/100;poi.shake=.3}
function splashRipples(){ripples.push({x:poi.x,y:poi.y,r:14*U,a:.9,d:0},{x:poi.x,y:poi.y,r:6*U,a:.7,d:.12})}
function tapPoi(){
  if(state!=='play'||poi.busy>0)return;
  audio();
  if(poi.down)liftPoi();else enterWater();
}
function enterWater(){
  poi.down=true;sfx.dip();splashRipples();
  for(const f of fishes){
    const d=Math.hypot(f.x-poi.x,f.y-poi.y);
    if(d<220*U){f.flee=.9;f.th=Math.atan2(f.y-poi.y,f.x-poi.x);f.tt=f.th}
  }
  damage(3);
}
function liftPoi(){
  poi.down=false;poi.busy=.45;sfx.lift();splashRipples();
  let target=null,bd=1e9;
  for(const f of fishes){
    if(f.a<.8)continue;
    const d=Math.hypot(f.x-poi.x,f.y-poi.y);
    if(d<(PR-RW/2)*U*KINDS[f.kind].catchR&&d<bd){bd=d;target=f}
  }
  if(target){
    const K=info(target.kind,target.v);
    fishes.splice(fishes.indexOf(target),1);
    respawn.push({kind:target.kind,t:1.6+Math.random()});
    const g=Math.round(K.gMin+(K.gMax-K.gMin)*Math.pow(Math.random(),1.6));
    poi.hold={kind:target.kind,v:target.v,L:target.L,g,th:target.th};
    caught.push({kind:target.kind,v:target.v,g,pts:K.pts});
    score+=K.pts;damage(K.dmg);
    sfx.catch(target.kind!=='small');
  }
}
function afterDip(){
  if(poi.hold)return openCatch(poi.hold);
  settle();
}
function settle(){
  if(hp<=.0001)return breakPoi();
  if(time<=0)return timeUp();
  state='play';
}
function breakPoi(){
  poi.down=false;lives--;state='broken';brokenT=1.2;sfx.brk();toast('ポイが やぶれた！');hud();
}
function timeUp(){poi.down=false;state='ending';endT=1.2;sfx.end();toast('じかんぎれ！')}
const fmtW=g=>g<1000?g+'g':(g/1000).toFixed(1)+'kg';

let catchAt=0,catchAnim=0;
function openCatch(h){
  state='catch';const K=info(h.kind,h.v);
  $('#cName').textContent=K.name;$('#cSub').textContent=K.sub;$('#cWt').textContent=fmtW(h.g);
  $('#cDesc').textContent=K.desc;$('#cPts').textContent='+'+K.pts+'点';
  $('#cArtist').textContent=K.artist?'絵：'+K.artist:'';$('#cArtist').style.display=K.artist?'':'none';
  show('catch');catchAt=performance.now();catchData=h;
  cancelAnimationFrame(catchAnim);
  const fc=$('#fishView'),g=fc.getContext('2d');
  const tick=t=>{
    if(state!=='catch')return;
    const im=h.v&&h.v.ready?h.v:null;
    let vL=K.viewL;if(im)vL=Math.min(540,290*im.img.naturalWidth/im.img.naturalHeight)/1.12;
    g.clearRect(0,0,600,360);g.save();g.translate(300+(im&&im.anim==='pulse'?0:vL*.06),180);g.rotate(-.06);
    if(im)drawImgFish(g,im,vL,t/160,false,.035);else drawFish(g,vL,t/160,{...colorStyle(h.kind),amp:.06},7);
    g.restore();
    catchAnim=requestAnimationFrame(tick);
  };
  catchAnim=requestAnimationFrame(tick);
}
let catchData=null;
$('#catch').addEventListener('pointerdown',()=>{
  if(state!=='catch'||performance.now()-catchAt<600)return;
  sfx.tap();poi.hold=null;show(null);settle();
});

let lastResult=null;
function showResult(){
  state='result';
  lastResult={score,playSeconds:Math.round(GAME_TIME-Math.max(0,time)),poiLeft:Math.max(0,lives),
    catches:caught.map(c=>{const K=info(c.kind,c.v);return {species:c.v?c.v.id:c.kind,name:K.name,size:{small:'S',medium:'M',large:'L'}[c.kind],weightGrams:c.g,points:c.pts,artist:K.artist||null}})};
  $('#rScore').textContent=score;
  const top=caught.slice().sort((a,b)=>b.g-a.g)[0];
  $('#rTop').textContent=top?`いちばんの大物：${info(top.kind,top.v).name}（${fmtW(top.g)}）`:'ざんねん… 1ぴきも すくえなかった';
  const isBest=score>best&&score>0;
  if(isBest){best=score;store.set('kingyo_best',best)}
  $('#rBest').textContent=isBest?'★ ベストきろく こうしん！':(best?`ベスト ${best}点`:'');
  const list=$('#rList');
  list.innerHTML=caught.length?caught.map(c=>`<div class="rrow"><span>${info(c.kind,c.v).name}</span><span>${fmtW(c.g)}</span><span>${c.pts}点</span></div>`).join(''):'<div class="rempty">またちょうせんしてね</div>';
  list.scrollTop=0;
  show('result');
}
function toTitle(){
  sfx.tap();state='title';poi.hold=null;time=GAME_TIME;score=0;lives=POI_LIVES;hp=hpShown=1;hud();
  $('#titleBest').textContent=best?`ベストきろく ${best}点`:'';show('title');
}
$('#btnStart').addEventListener('click',startGame);
$('#btnRetry').addEventListener('click',startGame);
$('#btnTitle').addEventListener('click',toTitle);
$('#btnSend').addEventListener('click',()=>{if(!lastResult)return;sfx.tap();KingyoScore.submit(KingyoScore.build(lastResult))});

/* ---------- 入力 ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||state!=='play')return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>10)drag.moved=true;
  const ins=PR*U*.5;poi.tx=clamp(poi.tx+dx,pool.l+ins,pool.r-ins);poi.ty=clamp(poi.ty+dy,pool.t,pool.b);
});
const endDrag=e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const tap=!drag.moved&&performance.now()-drag.t<500&&e.type==='pointerup';
  drag=null;if(tap)tapPoi();
};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(state==='play')tapPoi()}
  const m=5*U*3;
  if(state==='play'){
    if(e.code==='ArrowLeft')poi.tx=clamp(poi.tx-m,pool.l+PR*U*.5,pool.r);
    if(e.code==='ArrowRight')poi.tx=clamp(poi.tx+m,pool.l,pool.r-PR*U*.5);
    if(e.code==='ArrowUp')poi.ty=clamp(poi.ty-m,pool.t,pool.b);
    if(e.code==='ArrowDown')poi.ty=clamp(poi.ty+m,pool.t,pool.b);
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- ループ ---------- */
function update(dt){
  clock+=dt;
  updateFish(dt*(state==='catch'?0:1));
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];if(r.d>0){r.d-=dt;continue}r.r+=150*U*dt;r.a-=dt*1.1;if(r.a<=0)ripples.splice(i,1)}
  const k=1-Math.exp(-22*dt);poi.x+=(poi.tx-poi.x)*k;poi.y+=(poi.ty-poi.y)*k;
  poi.shake=Math.max(0,poi.shake-dt);
  poi.s+=((poi.down?.9:1.06)-poi.s)*(1-Math.exp(-16*dt));
  hpShown+=(Math.max(0,hp)-hpShown)*(1-Math.exp(-12*dt));
  if(state==='play'){
    time-=dt;
    if(poi.down){
      const mv=Math.hypot(poi.tx-poi.x,poi.ty-poi.y)*22/U;
      hp-=(.07+.07*Math.min(1,mv/300))*dt;
      if(hp<=0){hp=0;poi.down=false;poi.busy=.3;splashRipples();sfx.brk()}
    }
    if(poi.busy>0){poi.busy-=dt;if(poi.busy<=0)afterDip()}
    else if(time<=0)timeUp();
  }else if(state==='broken'){
    brokenT-=dt;
    if(brokenT<=0){
      if(lives<=0)showResult();
      else{hp=1;hpShown=0;poi.tx=poi.x=(pool.l+pool.r)/2;poi.ty=poi.y=pool.t+pool.h*.72;state='play'}
    }
  }else if(state==='ending'){endT-=dt;if(endT<=0)showResult()}
  hud();
}
function draw(){
  if(!bg)return;
  const g=ctx;
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);g.drawImage(bg,0,0,W,H);
  g.save();g.beginPath();g.rect(pool.l,pool.t,pool.w,pool.h);g.clip();
  for(const f of fishes){
    g.save();g.translate(f.x,f.y);g.rotate(f.th);g.scale(1,f.fy);g.globalAlpha=f.a;
    if(f.v&&f.v.ready)drawImgFish(g,f.v,f.L*U,f.phase,true);else drawFish(g,f.L*U,f.phase,silFor(f.kind),1);
    g.restore();
  }
  for(const r of ripples){
    if(r.d>0)continue;
    g.strokeStyle=`rgba(255,255,255,${Math.max(0,r.a)})`;g.lineWidth=3.5*U;
    g.beginPath();wob(g,r.x,r.y,r.r,Math.round(r.r)%7+1,.06,24);g.stroke();
  }
  g.restore();
  if(state!=='title'){
    let s=poi.s+(poi.down?0:.012*Math.sin(clock*3)),alpha=1,rot=0,ox=0,oy=0,water=poi.down;
    if(state==='broken'){const t=1-brokenT/1.2;oy=t*t*90*U;rot=t*.9;alpha=clamp(brokenT/.5,0,1)}
    if(poi.shake>0){ox=(Math.random()-.5)*8*U;oy+=(Math.random()-.5)*8*U}
    drawPoi(g,{x:poi.x+ox,y:poi.y+oy,s,alpha,rot,water,hp:state==='broken'?0:hp,hold:poi.hold});
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(frame);
}

poi.x=poi.tx=0;poi.y=poi.ty=0;
resize();
poi.x=poi.tx=(pool.l+pool.r)/2;poi.y=poi.ty=pool.t+pool.h*.72;
populate();hud();
$('#titleBest').textContent=best?`ベストきろく ${best}点`:'';
if(location.hash==='#debug')window.__dbg={KINDS,get fishes(){return fishes},poi,setTime:t=>{time=t},get state(){return state}};
addEventListener('resize',resize);
requestAnimationFrame(frame);
})();
</script>
